[workspace]
members = ["crates/cpl-song", "crates/cpl-layout", "crates/cpl-app", "crates/cpl-render"]
resolver = "3"

[package]
name = "cpl"
version = "0.1.0"
edition = "2024"

[dependencies]
cpl-song = { path = "crates/cpl-song" }
cpl-app = { path = "crates/cpl-app" }
cpl-render = { path = "crates/cpl-render" }
winit = "0.30"
wgpu = "30"
